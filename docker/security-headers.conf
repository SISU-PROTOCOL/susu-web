# Response headers applied to every location that serves the app.
#
# A separate file because nginx's `add_header` is not inherited once a location
# declares one of its own — the two cache locations in `nginx.conf` each set a
# `Cache-Control`, so without this they would each silently drop these.
# Including the same file in both is what keeps the set identical everywhere.

# Stops a browser from re-interpreting a `.js` or `.css` response as something
# else, which matters for a bundle whose filenames are content hashes: a
# correctly typed 404 page cannot be executed as script.
add_header X-Content-Type-Options "nosniff" always;

# The app is reached from an emailed auth link, and those URLs carry tokens in
# the fragment. Sending the full URL to a third party as a `Referer` would hand
# them out; the origin is sent instead, which is all anyone needs.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing embeds this app, and a wallet flow is worth protecting from being
# clicked through inside someone else's frame.
add_header X-Frame-Options "DENY" always;

# Two headers are deliberately absent.
#
# No `Content-Security-Policy`. A useful policy here has to name the Supabase
# project origin, the Soroban RPC endpoint and the block explorer, and has to
# allow the Freighter extension's injected script — a policy written without
# testing those against a real deployment either breaks the wallet flow or
# breaks the transaction pipeline, and both failures look like bugs in this app
# rather than in its headers. It is left for whoever deploys this, with the
# endpoints listed in `.env.example`.
#
# No `Cross-Origin-Opener-Policy`. The Freighter adapter talks to the extension
# through a window handle, and severing that relationship severs the wallet.
